# ---------------------------------------------------------------------------
# Faceless FRS - default configuration
#
# Every value here can be overridden by an environment variable using the
# prefix FRS_ and __ as the nesting separator, e.g.
#   FRS_DETECTION__CONF_THRESHOLD=0.5
#   FRS_DEVICE=cpu
# Env vars win over this file. See backend/app/core/config.py.
# ---------------------------------------------------------------------------

project_name: "Faceless FRS"

# "cuda", "cpu", or "auto" (picks cuda when available)
device: auto

paths:
  data_dir: data
  models_dir: data/models
  enrollment_dir: data/enrollment
  test_videos_dir: data/test_videos
  output_dir: data/output

detection:
  # Ultralytics model name or path. yolov8n = nano, fastest; step up to
  # yolov8s/m if recall on small/distant people is poor.
  model: yolov8n.pt
  conf_threshold: 0.35      # min detection confidence to keep a box
  iou_threshold: 0.5        # NMS IoU
  # COCO class 0 is "person" - the only class this system cares about.
  person_class_id: 0
  imgsz: 640
  # Drop boxes smaller than this many pixels tall; tiny boxes yield useless
  # face/gait/re-ID crops later and just create junk tracks.
  min_box_height: 60
  half: true                # fp16 inference on CUDA (ignored on CPU)

tracking:
  # Frames a track survives without a matching detection before deletion.
  max_age: 30
  # Consecutive detections required before a tentative track is confirmed.
  n_init: 3
  # Max cosine distance for appearance-embedding association.
  max_cosine_distance: 0.35
  nn_budget: 100
  # DeepSORT's own lightweight appearance embedder. This is for association
  # only - it is NOT the re-ID embedding used for matching (Phase 4 / OSNet).
  embedder: mobilenet
  embedder_gpu: true

video:
  # Process every Nth frame. 1 = every frame. Raising this speeds up long
  # videos at the cost of tracking continuity.
  frame_stride: 1
  # Cap frames processed per run; null = whole video.
  max_frames: null
  # Write an annotated video with boxes + track IDs to paths.output_dir.
  save_annotated: false

logging:
  level: INFO
  # Log a progress line every N processed frames.
  progress_every: 30

# --- Phase 2: face branch --------------------------------------------------
face:
  # buffalo_l downloads ~280MB to ~/.insightface on first use.
  model_pack: buffalo_l
  det_size: 640
  # Needs onnxruntime-gpu matching your CUDA build; the plain onnxruntime
  # wheel is CPU-only and this falls back with a warning.
  use_gpu: false
  min_frames: 1
  min_quality: 0.15
  # ArcFace degrades sharply with yaw, so a confidently-detected profile face
  # is scored down even though the detector was sure it found a face.
  frontal_yaw_deg: 20.0
  max_yaw_deg: 65.0
  ideal_face_height: 112.0
  enroll_top_fraction: 0.4
  enroll_min_frames: 10

# --- Phase 3: gait branch --------------------------------------------------
gait:
  seg_model: yolov8n-seg.pt
  seg_conf: 0.30
  # 64x44 is the standard gait silhouette canvas used by GaitSet/GaitGL/
  # GaitBase. Keeping that shape means a learned encoder can be swapped in
  # later without redoing any preprocessing.
  silhouette_height: 64
  silhouette_width: 44
  # One gait cycle is ~20-30 frames at 25fps. Below min_frames the branch
  # reports no signal rather than guessing from half a step.
  min_frames: 20
  # Plausible half-cycle period, IN SECONDS (LOG-06). These were frame counts,
  # which assumed 25fps with nothing skipped. Set video.frame_stride: 5 and a
  # real half-cycle became ~2.4 samples, under the old floor of 7, so gait
  # reported nothing for everybody and it looked like poor footage rather than
  # configuration. Lag bounds now come from the measured sample rate.
  # 0.28-1.6s spans a run to a slow walk; at 25fps stride 1 that is 7 and 40
  # samples, exactly the old values, so tuned footage behaves as before.
  min_half_period_s: 0.28
  max_half_period_s: 1.6
  # Assumed rate when silhouettes carry no timestamps (hand-built sequences).
  assumed_fps: 25.0
  # Below this fraction of the cadence grid backed by a real silhouette, the
  # signal is mostly interpolation across gaps, and a period recovered from it
  # describes np.interp rather than a walk.
  min_cadence_coverage: 0.6
  # Samples the shortest half cycle must span before cadence is believed.
  # Below ~3, autocorrelation locks onto the full cycle and reports twice the
  # real period with high confidence. At 25fps this allows frame_stride up to
  # 2; beyond that gait refuses rather than reporting a wrong cadence.
  min_samples_per_half_period: 3.0
  # A stationary person filmed by a panning camera still produces weak
  # periodicity from mask jitter (measured 0.18-0.32 on such footage). These
  # two gates are what stop that being reported as a walk.
  min_periodicity: 0.55
  min_swing_ratio: 0.12
  # A body does not change size while walking. Big swings in silhouette area
  # mean the segmenter is failing, not that someone is walking.
  # Measured: real walking 0.033-0.045, unstable segmentation 0.159.
  max_area_cv: 0.10
  # "gei" is a classical descriptor needing no trained weights. "opengait"
  # would use a learned encoder - see docs/phase-notes.md for why that is not
  # the default.
  encoder: gei
  descriptor_height: 32
  descriptor_width: 22
  min_silhouette_coverage: 0.12
  min_quality: 0.25

# --- Phase 4: re-ID branch -------------------------------------------------
reid:
  # osnet_x1_0 is 2.7M params, ~11MB of weights, downloaded on first use.
  # osnet_x0_25 is much faster if throughput matters more than accuracy --
  # but only ImageNet weights exist for it, so see the warning below.
  model: osnet_x1_0

  # Which checkpoint (DES-01). This branch used to load OSNet's ImageNet
  # weights and present generic classification features as re-identification.
  #   msmt17        re-ID. 4,101 identities, 15 cameras, indoor and outdoor,
  #                 day and night -- the most varied single re-ID dataset, so
  #                 the best default for cameras it has never seen.
  #   market1501    re-ID, one campus. Better benchmarks, narrower conditions.
  #   dukemtmcreid  re-ID, outdoor campus.
  #   multi_source  MSMT17 + DukeMTMC + CUHK03 together, trained to transfer
  #                 to unseen cameras. Requires model: osnet_ibn_x1_0.
  #   imagenet      NOT re-ID. Warns loudly on every start. Available for the
  #                 small fast variants, which have nothing else published.
  weights: msmt17
  # OSNet's training input size. Changing this without retraining breaks it.
  input_height: 256
  input_width: 128
  min_frames: 3
  min_quality: 0.20
  ideal_box_height: 192.0
  # A standing person is ~2.5x taller than wide. Boxes far from this are
  # usually a partial body or two people merged into one detection.
  ideal_aspect: 2.5
  # Re-ID mostly encodes clothing, so it goes stale in a way face and gait do
  # not. After this many days a stored reference is worth half its weight; a
  # strong match weeks later probably means a similar jacket, not the same
  # person. Set to 0 to disable decay.
  trust_half_life_days: 3.0

# --- Phases 5-6: fusion ----------------------------------------------------
fusion:
  # single_best | average (the reference paper's baseline) | quality_weighted
  strategy: quality_weighted

  # Anchors putting the three modalities on one comparable scale. Raw cosine
  # similarities are NOT comparable: measured, two different people score 0.03
  # by face but 0.755 by re-ID. Averaging raw scores lets re-ID dominate
  # purely by living in a higher numeric range.
  #
  # These are measurements, but from very few clips. Re-derive them from the
  # Phase-10 TAR@FAR curve on real footage before operational use.
  face_impostor: 0.03      # different people, measured
  face_genuine: 0.95       # same person, measured
  gait_impostor: 0.52      # different walking styles, centred, synthetic
  gait_genuine: 0.95
  # Re-measured under the msmt17 checkpoint (DES-01). Previously 0.755/0.980,
  # measured against OSNet's ImageNet weights, which are not a re-ID model.
  # Enrolment clip vs probe clip, same fixtures, both checkpoints:
  #                impostor   genuine   separation
  #   imagenet       0.765     0.942      0.177
  #   msmt17         0.726     0.881      0.155
  # One photograph, two people, no variation in pose or lighting -- re-derive
  # from the Phase-10 TAR@FAR curve on real footage before operational use.
  reid_impostor: 0.726
  reid_genuine: 0.881
  # Which checkpoint the two numbers above were measured against. When this
  # disagrees with reid.weights, the console shows the mismatch to whoever is
  # reviewing a match rather than leaving it in a log.
  reid_anchors_measured_on: msmt17

  # On the calibrated scale 0.5 means "halfway between a stranger and a
  # genuine match".
  threshold: 0.55

  # Gait descriptors are dominated by the shared "generic human" shape, so the
  # population mean has to be removed before comparing. Below this many
  # references there is no way to estimate that mean, and gait refuses to
  # compare rather than returning a misleadingly high similarity.
  gait_min_references_for_centring: 3

track_buffer:
  # Bounded on purpose: unbounded per-track crop buffers exhaust memory on a
  # busy camera long before anything else breaks.
  max_observations: 64
  store_height: 256
  min_box_height: 60
  max_tracks: 50

matching:
  # Starting point only. Calibrate against your own footage with the Phase-10
  # TAR@FAR curve before trusting any number here.
  face_threshold: 0.40
  # Gait, compared with the population mean removed. Measured: different
  # walking styles peaked at 0.516, same style 1.000. WITHOUT centring
  # everything scores above 0.93 and this would match everyone -- which is why
  # uncentred gait refuses to compare rather than returning a number.
  gait_threshold: 0.70
  # Re-ID similarities cluster high and narrow, so face thresholds do not
  # transfer. Was 0.88, from ImageNet-weight measurements. Under the msmt17
  # checkpoint the enrolled subject scores 0.881 against their own probe and
  # 0.726 against the impostor, so 0.88 sat on top of the genuine score and
  # would have rejected a correct match on a rounding error. 0.80 is the
  # midpoint, with similar margin either side.
  reid_threshold: 0.80
  min_track_observations: 5
  rematch_every: 15
  # Embedding all 64 buffered crops made the face branch 70% of runtime at
  # 5.3s per track. Aggregation is quality-weighted, so the poorest crops
  # barely move the result. 0 disables the cap.
  max_observations_to_embed: 16

# --- Phase 9: alerting -----------------------------------------------------
# Alerts fire ONLY on human-confirmed decisions. Sending additionally requires
# --send on the CLI, because accidentally messaging a real contact list during
# testing cannot be undone.
#
# Credentials belong in the environment, not here. See .env.example:
#   FRS_ALERTS__SMTP_PASSWORD, FRS_ALERTS__TWILIO_AUTH_TOKEN
alerts:
  transport: console        # console | smtp | twilio

  smtp_host: ""
  smtp_port: 587
  smtp_sender: ""
  smtp_use_tls: true
  smtp_recipients: ""       # comma-separated

  twilio_from_number: ""
  twilio_to_numbers: ""     # comma-separated

  # Linked from SMS alerts, which are too short to carry the full breakdown.
  console_url: "http://localhost:5173"
